[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wrf-tools"
version = "0.1.0"
description = "General-purpose WRF, WRF-LES, WPS, and OpenFAST utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Adi"}]
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
]

[project.optional-dependencies]
netcdf = ["netCDF4>=1.6"]
science = ["scipy>=1.11"]
plot = ["matplotlib>=3.8", "cartopy>=0.22"]
wrf = ["wrf-python>=1.3.4.1"]
test = ["pytest>=8"]
all = [
    "netCDF4>=1.6",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "wrf-python>=1.3.4.1",
    "pytest>=8",
]

[project.scripts]
wrf-tools = "wrf_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
