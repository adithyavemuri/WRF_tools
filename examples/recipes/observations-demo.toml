# Made-up observations demonstrate ingestion/alignment/statistics only.
# wrf-tools run-recipe examples/recipes/observations-demo.toml --output example_results/recipe-observations
# Replace from_columns with observations.read_csv/read_netcdf for your own data.

[[steps]]
id = "observed"
call = "observations.from_columns"
kwargs = {time = ["2025-01-10T00:00:00", "2025-01-10T01:00:00", "2025-01-10T02:00:00"], variables = {speed = [8.0, 9.0, 10.0]}}

[[steps]]
id = "model"
call = "observations.from_columns"
kwargs = {time = ["2025-01-10T00:00:00", "2025-01-10T01:00:00", "2025-01-10T02:00:00"], variables = {speed = [9.0, 9.5, 10.0]}}

[[steps]]
id = "observed_utc"
call = "observations.normalize_time"
args = [{ref = "observed"}]

[[steps]]
id = "model_utc"
call = "observations.normalize_time"
args = [{ref = "model"}]

[[steps]]
id = "matched"
call = "observations.align"
args = [{ref = "model_utc"}, {ref = "observed_utc"}]

[[steps]]
id = "statistics"
call = "validation.comparison_summary"
args = [{ref = "matched", path = [0], variable = "speed", array = true}, {ref = "matched", path = [1], variable = "speed", array = true}]
save = "comparison.json"

[[steps]]
id = "scatter"
call = "plotting.validation_scatter"
args = [{ref = "matched", path = [0], variable = "speed", array = true}, {ref = "matched", path = [1], variable = "speed", array = true}]
save = "comparison.png"
